<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скоринг локаций · Белград</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  #map{position:absolute;inset:0}
  .legend{position:absolute;right:12px;top:12px;z-index:1000;background:#fff;padding:10px 12px;
    border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:13px;max-width:240px}
  .legend h4{margin:0 0 6px;font-size:13px}
  .legend .row{display:flex;align-items:center;margin:2px 0}
  .legend i{width:16px;height:12px;margin-right:7px;border-radius:2px;display:inline-block}
  .legend .sub{color:#6b7280;font-size:11px;margin-top:6px;line-height:1.4}
  .legend a{color:#2563eb;text-decoration:none}
  .title{position:absolute;left:12px;top:12px;z-index:1000;background:#fff;padding:8px 12px;
    border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:14px;font-weight:600;max-width:48%}
  .title small{display:block;font-weight:400;color:#6b7280;font-size:11px;margin-top:3px}
  .dodo-marker{width:28px;height:28px;border-radius:50%;background:#fff;
    box-shadow:0 0 0 2px #ff6900,0 2px 6px rgba(0,0,0,.3);padding:2px;box-sizing:border-box}
  .dodo-marker img{width:100%;height:100%;border-radius:50%}
</style></head><body>
<div id="map"></div>
<div class="title">🔥 Скоринг локаций под пиццерию · Белград<small>Красный = лучшие места. Многофакторно: жители+транспорт+магазины+общепит+офисы − конкуренты.</small></div>
<div class="legend">
  <h4>Скоринг локации (0–100)</h4>
  <div id="buckets"></div>
  <div class="row"><img src="dodo-logo.png" style="width:16px;height:16px;margin-right:7px"> точка Dodo</div>
  <div class="sub">Сетка гексагонов H3 r8. Та же формула, что в карточках лотов.<br>
    <a href="lokali.html">← лоты со скорингом</a> · <a href="naselje.html">плотность</a></div>
</div>
<script>
const DODO=[{name:'Dodo · Земун/Новый Белград',lat:44.8456204,lon:20.4012657},
            {name:'Dodo · Стари Град',lat:44.814985,lon:20.4564471}];
const map=L.map('map').setView([44.81,20.46],12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {attribution:'© OpenStreetMap, © CARTO',maxZoom:19}).addTo(map);
const STOPS=[[80,'#800026'],[70,'#bd0026'],[60,'#e31a1c'],[50,'#fc4e2a'],
             [40,'#fd8d3c'],[30,'#feb24c'],[20,'#fed976'],[0,'#ffffcc']];
function col(s){ for(const [t,c] of STOPS){ if(s>=t) return c; } return '#ffffcc'; }
fetch('score_heatmap_bg.geojson').then(r=>r.json()).then(gj=>{
  L.geoJSON(gj,{
    style:f=>({fillColor:col(f.properties.score),weight:0.3,color:'#888',fillOpacity:0.68}),
    onEachFeature:(f,l)=>{const p=f.properties;
      l.bindPopup(`Скоринг <b>${p.score}/100</b><hr style="margin:4px 0;border:0;border-top:1px solid #eee">`+
        `👥 ~${Number(p.res500).toLocaleString('ru')} жит. в 500м<br>`+
        `🚏 ${p.transit} ост. · 🛍 ${p.shops} маг. · 🍽 ${p.food} общепит<br>`+
        `🏢 ${p.offices} офис. · ⚔️ ${p.comp} конкур. в 200м`);}
  }).addTo(map);
});
const dodoIcon=L.divIcon({className:'',html:'<div class="dodo-marker"><img src="dodo-logo.png"></div>',
  iconSize:[28,28],iconAnchor:[14,14]});
DODO.forEach(d=>L.marker([d.lat,d.lon],{icon:dodoIcon,zIndexOffset:1000}).bindPopup(d.name).addTo(map));
const bk=document.getElementById('buckets');
const labels=['80+ 🟥','70–80','60–70','50–60','40–50','30–40','20–30','< 20'];
STOPS.forEach((s,i)=>bk.insertAdjacentHTML('beforeend',
  `<div class="row"><i style="background:${s[1]}"></i>${labels[i]}</div>`));
</script></body></html>
