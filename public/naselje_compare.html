<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плотность населения · Нови-Сад · Kontur vs OSM</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  #map{position:absolute;inset:0}
  .legend{position:absolute;right:12px;top:12px;z-index:1000;background:#fff;padding:10px 12px;
    border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:13px;max-width:250px}
  .legend h4{margin:0 0 6px;font-size:13px}
  .legend .row{display:flex;align-items:center;margin:2px 0}
  .legend i{width:16px;height:12px;margin-right:7px;border-radius:2px;display:inline-block}
  .legend .sub{color:#6b7280;font-size:11px;margin-top:6px;line-height:1.4}
  .legend a{color:#2563eb;text-decoration:none}
  .title{position:absolute;left:12px;top:12px;z-index:1000;background:#fff;padding:8px 12px;
    border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:14px;font-weight:600;max-width:46%}
  .title small{display:block;font-weight:400;color:#6b7280;font-size:11px;margin-top:3px}
  .switch{position:absolute;left:12px;top:64px;z-index:1000;background:#fff;border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);display:flex;overflow:hidden;font-size:13px}
  .switch button{border:0;background:#fff;padding:8px 14px;cursor:pointer;font-weight:600;color:#374151}
  .switch button.on{background:#ff6900;color:#fff}
</style></head><body>
<div id="map"></div>
<div class="title" id="ttl"></div>
<div class="switch">
  <button id="bK" onclick="setMode('kontur')">Kontur</button>
  <button id="bO" onclick="setMode('osm')">OSM · этажность</button>
</div>
<div class="legend">
  <h4>Жителей на км²</h4>
  <div id="buckets"></div>
  <div class="sub" id="src"></div>
</div>
<script>
const TITLES={
  kontur:['🗺 Kontur Population (H3 r8)','Census-калибровка по площади застройки. Не различает этажность → частный сектор завышен.'],
  osm:['🗺 OSM · оценка по этажности','Σ(footprint × этажей × 0.8)/30. Нормировано на тот же тотал. Высотки выделяются, частный сектор проседает.']
};
const map = L.map('map').setView([45.2551, 19.8452], 13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {attribution:'© OpenStreetMap, © CARTO', maxZoom:19}).addTo(map);
const STOPS=[[8000,'#800026'],[5000,'#bd0026'],[3000,'#e31a1c'],[2000,'#fc4e2a'],
             [1000,'#fd8d3c'],[400,'#feb24c'],[100,'#fed976'],[0,'#ffeda0']];
function col(d){ for(const [t,c] of STOPS){ if(d>=t) return c; } return '#ffeda0'; }
let GJ=null, layer=null, mode='kontur';
function val(p){ return mode==='kontur'?p.kontur:p.osm_norm; }
function render(){
  if(layer) map.removeLayer(layer);
  layer=L.geoJSON(GJ,{
    style:f=>({fillColor:col(val(f.properties)),weight:0.3,color:'#999',fillOpacity:0.62}),
    onEachFeature:(f,l)=>{const p=f.properties;
      l.bindPopup(`<b>${val(p).toLocaleString('ru')}</b> чел./км² (${mode==='kontur'?'Kontur':'OSM'})`+
        `<hr style="margin:4px 0;border:0;border-top:1px solid #eee">`+
        `Kontur: ${p.kontur.toLocaleString('ru')}/км²<br>OSM (норм.): ${p.osm_norm.toLocaleString('ru')}/км²`);}
  }).addTo(map);
}
function setMode(m){ mode=m;
  document.getElementById('bK').className=m==='kontur'?'on':'';
  document.getElementById('bO').className=m==='osm'?'on':'';
  document.getElementById('ttl').innerHTML=TITLES[m][0]+'<small>'+TITLES[m][1]+'</small>';
  render();
}
fetch('density_compare_ns.geojson').then(r=>r.json()).then(gj=>{GJ=gj; setMode('kontur');});
L.marker([45.2551,19.8452]).addTo(map).bindPopup('Trg slobode · центр');
const bk=document.getElementById('buckets');
const labels=['8 000+','5–8 тыс','3–5 тыс','2–3 тыс','1–2 тыс','400–1000','100–400','< 100'];
STOPS.forEach((s,i)=>bk.insertAdjacentHTML('beforeend',
  `<div class="row"><i style="background:${s[1]}"></i>${labels[i]}</div>`));
document.getElementById('src').innerHTML='Переключай Kontur ↔ OSM — шкала общая.<br>'+
  '<a href="naselje_ns.html">только Kontur</a> · <a href="naselje.html">Белград</a>';
</script></body></html>
